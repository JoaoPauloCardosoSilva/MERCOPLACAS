{% extends "base.html" %}

{% block title %}Editar Gasto - MERCOPLACAS{% endblock %}

{% block content %}
<style>
    .editar-gasto { max-width:760px; margin:30px auto; padding:24px; background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.06); }
    .editar-gasto h1 { margin-top:0; }
    .editar-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .editar-campo { display:flex; flex-direction:column; gap:7px; }
    .editar-campo label { font-weight:600; font-size:13px; }
    .editar-campo input, .editar-campo select { padding:11px 12px; border:1px solid #d7dce2; border-radius:9px; font:inherit; }
    .editar-descricao { grid-column:span 2; }
    .editar-acoes { display:flex; gap:10px; margin-top:20px; }
    .btn-editar-form { border:0; border-radius:9px; padding:11px 17px; font-weight:600; cursor:pointer; text-decoration:none; }
    .btn-salvar-form { background:#1e3a5f; color:#fff; }
    .btn-cancelar-form { background:#eef1f5; color:#263342; }
    @media(max-width:600px){ .editar-grid{grid-template-columns:1fr;} .editar-descricao{grid-column:span 1;} }
</style>

<div class="editar-gasto">
    <h1>Editar gasto</h1>
    <p>Altere os dados do gasto e salve as modificações.</p>

    <form method="POST">
        <div class="editar-grid">
            <div class="editar-campo">
                <label for="data">Data</label>
                <input type="date" id="data" name="data" value="{{ gasto.data }}" required>
            </div>

            <div class="editar-campo">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    {% for categoria in ['Ribbon', 'Lâminas', 'Compras', 'Funcionários', 'Água', 'Luz', 'Internet', 'Telefone', 'Outras despesas'] %}
                    <option value="{{ categoria }}" {% if gasto.categoria == categoria %}selected{% endif %}>{{ categoria }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="editar-campo editar-descricao">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" value="{{ gasto.descricao or '' }}">
            </div>

            <div class="editar-campo">
                <label for="valor">Valor</label>
                <input type="number" id="valor" name="valor" min="0" step="0.01" value="{{ gasto.valor }}" required>
            </div>
        </div>

        <div class="editar-acoes">
            <button type="submit" class="btn-editar-form btn-salvar-form">Salvar alterações</button>
            <a href="{{ url_for('gastos') }}" class="btn-editar-form btn-cancelar-form">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
