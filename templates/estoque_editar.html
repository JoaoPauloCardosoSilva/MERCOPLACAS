{% extends "base.html" %}
{% block title %}Editar Estoque - MERCOPLACAS{% endblock %}
{% block content %}
<div style="padding:24px;max-width:700px;margin:auto">
<div style="background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.06)">
<h1>Editar item do estoque</h1><p>Altere os dados do item e salve.</p>
<form method="POST">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div><label>Nome</label><input style="width:100%;padding:11px;box-sizing:border-box" name="nome" value="{{ item.nome }}" required></div>
<div><label>Categoria</label><input style="width:100%;padding:11px;box-sizing:border-box" name="categoria" value="{{ item.categoria or '' }}"></div>
<div><label>Quantidade</label><input style="width:100%;padding:11px;box-sizing:border-box" type="number" min="0" step="0.01" name="quantidade" value="{{ item.quantidade }}" required></div>
<div><label>Estoque mínimo</label><input style="width:100%;padding:11px;box-sizing:border-box" type="number" min="0" step="0.01" name="estoque_minimo" value="{{ item.estoque_minimo }}" required></div>
</div>
<div style="display:flex;gap:10px;margin-top:18px"><button type="submit" style="padding:11px 16px;border:0;border-radius:9px;background:#1e3a5f;color:#fff;font-weight:600">Salvar alterações</button><a href="{{ url_for('estoque') }}" style="padding:11px 16px;border-radius:9px;background:#eef1f5;color:#263342;text-decoration:none">Cancelar</a></div>
</form></div></div>
{% endblock %}
